[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdwisdom-hermes-ads"
version = "1.0.0"
description = "Autonomous Hermes agent studio for competitor intelligence, scriptwriting, and cinematic video ads generation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CrowdWisdomTrading AI Engineering Team" }
]
dependencies = [
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.0",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "edge-tts>=6.1.12"
]

[project.scripts]
crowdwisdom-ads = "app.cli:cli"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
